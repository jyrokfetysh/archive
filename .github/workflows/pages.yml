# Builds the site (share pages with Telegram/Discord link previews) and publishes it to GitHub Pages
# on every push to main — including the commits made from the admin page.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never stop a deployment halfway (two quick publishes from the admin page): queue them instead.
  cancel-in-progress: false

jobs:
  telegraph:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish all Telegraph pages
        env:
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node tools/publish-telegraph.mjs
      - name: Save Telegraph page URLs
        run: |
          if git diff --quiet -- data/catalog.js; then
            echo "No new Telegraph URLs to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.js
            git commit -m "Save Telegraph page URLs [skip ci]"
            git push
          fi
      - id: result
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: telegraph
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.telegraph.outputs.commit || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node tools/build.mjs --base "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
